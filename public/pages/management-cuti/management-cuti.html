<div class="smartoffice-wrapper">

  <!-- =========================
       HEADER
  ========================== -->
  <div class="smartoffice-header">

    <!-- LEFT -->
    <div class="smartoffice-header-info">

      <!-- BACK -->
      <button
        class="smartoffice-back-button"
        onclick="smartofficeLoadPage('dashboard')"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </button>

      <!-- ICON -->
      <div class="smartoffice-header-icon smartoffice-management-header-icon">

        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="38"
          height="38"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="
            M16 21v-2
            a4 4 0 0 0-4-4H5
            a4 4 0 0 0-4 4v2
          "/>

          <circle
            cx="8.5"
            cy="7"
            r="4"
          />

          <path d="
            M20 8v6
          "/>

          <path d="
            M23 11h-6
          "/>
        </svg>

      </div>

      <!-- TITLE -->
      <div class="smartoffice-header-title">

        <h2>
          Management Cuti
        </h2>

        <p>
          Monitoring dan riwayat cuti pegawai
        </p>

      </div>

    </div>

    <!-- REFRESH -->
    <button
      id="smartofficeManagementRefreshButton"
      class="smartoffice-refresh-button"
      title="Refresh Data"
    >

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.75"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M21 12a9 9 0 1 1-3-6.7"/>
        <polyline points="21 3 21 9 15 9"/>
      </svg>

    </button>

  </div>

  <!-- =========================
      MINI STATS
  ========================= -->
  <div class="smartoffice-cuti-stats-row">

    <!-- TOTAL PEGAWAI -->
    <div class="
      smartoffice-cuti-stat-card
      smartoffice-cuti-stat-blue
    ">

      <div class="
        smartoffice-cuti-stat-top
      ">

        <p>
          Pegawai
        </p>

        <div class="
          smartoffice-cuti-stat-icon
        ">

          <svg viewBox="0 0 24 24">

            <!-- Kepala -->
            <circle
              cx="9"
              cy="8"
              r="3"
            />

            <circle
              cx="17"
              cy="9"
              r="2.5"
            />

            <!-- Badan -->
            <path d="
              M3 20
              c0-3 3-5 6-5
              s6 2 6 5
            "/>

            <path d="
              M14 20
              c0-2.2 2-3.8 4.5-3.8
              S23 17.8 23 20
            "/>

          </svg>

        </div>

      </div>

      <h3 id="smartofficeManagementTotalPegawai">
        <span class="smartoffice-mini-loader"></span>
      </h3>

    </div>

    <!-- PENDING -->
    <div class="
      smartoffice-cuti-stat-card
      smartoffice-cuti-stat-orange
    ">

      <div class="
        smartoffice-cuti-stat-top
      ">

        <p>
          Pending
        </p>

        <div class="
          smartoffice-cuti-stat-icon
        ">

          <svg viewBox="0 0 24 24">

            <path d="
              M12 2
              a10 10 0 1 0 10 10
              A10 10 0 0 0 12 2
            "/>

            <path d="
              M12 7
              v6
            "/>

            <path d="
              M12 13
              l4 2
            "/>

          </svg>

        </div>

      </div>

      <h3 id="smartofficeManagementMenunggu">
        <span class="smartoffice-mini-loader"></span>
      </h3>

    </div>

    <!-- DISETUJUI -->
    <div class="
      smartoffice-cuti-stat-card
      smartoffice-cuti-stat-green
    ">

      <div class="
        smartoffice-cuti-stat-top
      ">

        <p>
          Disetujui
        </p>

        <div class="
          smartoffice-cuti-stat-icon
        ">

          <svg viewBox="0 0 24 24">

            <path d="
              M9 12
              l2 2
              l5-5
            "/>

            <circle
              cx="12"
              cy="12"
              r="9"
            />

          </svg>

        </div>

      </div>

      <h3 id="smartofficeManagementDisetujui">
        <span class="smartoffice-mini-loader"></span>
      </h3>

    </div>

  </div>

  <!-- =========================
      TAB
  ========================= -->
  <div class="smartoffice-tab-wrapper">

    <button
      id="smartofficeTabRekapCuti"
      class="
        smartoffice-tab-button
        active
      "
      onclick="
        smartofficeSwitchManagementCutiTab(
          'rekap'
        )
      "
    >
      <span>
        Rekap Pegawai
      </span>
    </button>

    <button
      id="smartofficeTabRiwayatManagement"
      class="
        smartoffice-tab-button
      "
      onclick="
        smartofficeSwitchManagementCutiTab(
          'riwayat'
        )
      "
    >
      <span>
        Riwayat Cuti
      </span>
    </button>

  </div>

  <!-- =========================
      REKAP PEGAWAI
  ========================= -->
  <div
    id="smartofficeManagementRekapContent"
    class="smartoffice-management-content"
  >

    <div class="
      smartoffice-management-search-card
    ">

      <!-- SEARCH -->
      <input
        type="text"
        id="smartofficeManagementSearchPegawai"
        placeholder="Cari nama atau NIP..."
      >

      <!-- STATUS KEPEGAWAIAN -->
      <select
        id="smartofficeManagementFilterStatusPegawai"
      >

        <option value="">
          Semua Status Kepegawaian
        </option>

        <option value="PNS">
          PNS
        </option>

        <option value="PPPK">
          PPPK
        </option>

        <option value="PPPK PARUH WAKTU">
          PPPK PARUH WAKTU
        </option>

        <option value="BLUD">
          BLUD
        </option>

      </select>

    </div>

    <div
      id="smartofficeManagementRekapList"
    ></div>

  </div>

  <!-- =========================
       RIWAYAT CUTI
  ========================= -->
  <div
    id="smartofficeManagementRiwayatContent"
    class="smartoffice-management-content"
    style="display:none;"
  >

    <div class="
      smartoffice-management-filter-card
    ">

      <div class="
        smartoffice-management-riwayat-filter-group
      ">

        <label>
          Pegawai
        </label>

        <select
          id="smartofficeManagementFilterPegawai"
        >
          <option value="">
            Semua Pegawai
          </option>
        </select>

      </div>

      <div class="
        smartoffice-management-riwayat-filter-group
      ">

        <label>
          Status
        </label>

        <select
          id="smartofficeManagementFilterStatus"
        >

          <option value="">
            Semua Status
          </option>

          <option value="MENUNGGU">
            Menunggu
          </option>

          <option value="DISETUJUI">
            Disetujui
          </option>

          <option value="DITOLAK">
            Ditolak
          </option>

        </select>

      </div>

      <div class="
        smartoffice-management-riwayat-filter-group
      ">

        <label>
          Bulan
        </label>

        <select
          id="smartofficeManagementFilterBulan"
        >

          <option value="">
            Semua Bulan
          </option>

          <option value="0">Januari</option>
          <option value="1">Februari</option>
          <option value="2">Maret</option>
          <option value="3">April</option>
          <option value="4">Mei</option>
          <option value="5">Juni</option>
          <option value="6">Juli</option>
          <option value="7">Agustus</option>
          <option value="8">September</option>
          <option value="9">Oktober</option>
          <option value="10">November</option>
          <option value="11">Desember</option>

        </select>

      </div>

      <div class="
        smartoffice-management-riwayat-filter-group
      ">

        <label>
          Tahun
        </label>

        <select
          id="smartofficeManagementFilterTahun"
        >
          <option value="">
            Semua Tahun
          </option>
        </select>

      </div>

      <button
        class="
          smartoffice-management-filter-button
        "
        onclick="
          smartofficeFilterManagementRiwayat()
        "
      >
        Cari
      </button>

      <button
        class="
          smartoffice-management-reset-button
        "
        onclick="
          smartofficeResetManagementRiwayat()
        "
      >
        Reset
      </button>

      <button
        class="
          smartoffice-management-print-button
        "
        onclick="
          smartofficeExportRiwayatCutiPdf()
        "
      >
        🖨 Print
      </button>

    </div>

    <div
      id="smartofficeManagementRiwayatList"
    ></div>

  </div>

</div>

<!-- =========================
     MODAL DETAIL
========================= -->
<div
  id="smartofficeManagementCutiDetailModal"
  class="smartoffice-approval-detail-modal"
>

  <div class="
    smartoffice-approval-detail-content
    smartoffice-riwayat-detail-content
  ">

    <div class="
      smartoffice-cuti-riwayat-modal-header
    ">

      <h3 class="
        smartoffice-cuti-riwayat-modal-title
      ">
        Detail Pengajuan Cuti
      </h3>

      <button
        class="
          smartoffice-cuti-riwayat-modal-close
        "
        onclick="
          smartofficeCloseManagementCutiDetail()
        "
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M18 6L6 18"/>
          <path d="M6 6l12 12"/>
        </svg>
      </button>

    </div>

    <div
      id="smartofficeManagementCutiDetailBody"
      class="
        smartoffice-cuti-riwayat-modal-body
      "
    ></div>

  </div>

</div>
