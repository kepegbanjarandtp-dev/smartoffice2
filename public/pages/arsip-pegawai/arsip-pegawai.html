<div class="smartoffice-wrapper">

  <!-- ======================================================
       HEADER
  ====================================================== -->
  <div class="smartoffice-header">

    <!-- LEFT -->
    <div class="smartoffice-header-info">

      <!-- BACK -->
      <button
        class="smartoffice-back-button"
        onclick="smartofficeLoadPage('dashboard')"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </button>

      <!-- ICON -->
      <div
        class="
          smartoffice-header-icon
          smartoffice-arsip-pegawai-header-icon
        "
      >
        <!-- FILE / ARSIP -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="38"
          height="38"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="
            M21 8
            v11
            a2 2 0 0 1-2 2H5
            a2 2 0 0 1-2-2V5
            a2 2 0 0 1 2-2h8
          "/>

          <path d="
            M21 8h-8
            V0
          "/>

          <path d="
            M9 13h6
          "/>

          <path d="
            M9 17h6
          "/>
        </svg>
      </div>

      <!-- TITLE -->
      <div class="smartoffice-header-title">
        <h2>
          Arsip Kepegawaian
        </h2>

        <p>
          Monitoring dan pengelolaan arsip pegawai
        </p>
      </div>
    </div>

    <!-- REFRESH -->
    <button
      id="smartofficeArsipPegawaiRefreshButton"
      class="smartoffice-refresh-button"
      onclick="
        smartofficeRefreshArsipPegawai()
      "
      title="Refresh Data"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.75"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="
            M21 12
            a9 9 0 1 1-3-6.7
          "
        />

        <polyline
          points="
            21 3 21 9 15 9
          "
        />
      </svg>
    </button>
  </div>

  <!-- ======================================================
       MINI STATS
  ====================================================== -->
  <div class="smartoffice-cuti-stats-row">

    <!-- TOTAL PEGAWAI -->
    <div
      class="
        smartoffice-cuti-stat-card
        smartoffice-cuti-stat-blue
      "
    >
      <div class="smartoffice-cuti-stat-top">
        <p>
          Total Pegawai
        </p>

        <div class="smartoffice-cuti-stat-icon">
          <!-- USERS -->
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="
                M16 21v-2
                a4 4 0 0 0-4-4H6
                a4 4 0 0 0-4 4v2
              "
            />

            <circle
              cx="9"
              cy="7"
              r="4"
            />

            <path
              d="
                M22 21v-2
                a4 4 0 0 0-3-3.87
              "
            />

            <path
              d="
                M16 3.13
                a4 4 0 0 1 0 7.75
              "
            />
          </svg>
        </div>
      </div>

      <h3 id="smartofficeArsipTotalPegawai">
        <span class="smartoffice-mini-loader"></span>
      </h3>
    </div>

    <!-- TERUPLOAD -->
    <div
      class="
        smartoffice-cuti-stat-card
        smartoffice-cuti-stat-orange
      "
    >
      <div class="smartoffice-cuti-stat-top">
        <p>
          Terupload
        </p>

        <div class="smartoffice-cuti-stat-icon">
          <!-- FILE UPLOAD -->
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="
                M14 2H6
                a2 2 0 0 0-2 2v16
                a2 2 0 0 0 2 2h12
                a2 2 0 0 0 2-2V8z
              "
            />

            <polyline
              points="
                14 2 14 8 20 8
              "
            />

            <path
              d="
                M12 18v-6
              "
            />

            <path
              d="
                m9 15 3-3 3 3
              "
            />
          </svg>
        </div>
      </div>

      <h3 id="smartofficeArsipTotalDokumen">
        <span class="smartoffice-mini-loader"></span>
      </h3>
    </div>

    <!-- TERVERIFIKASI -->
    <div
      class="
        smartoffice-cuti-stat-card
        smartoffice-cuti-stat-green
      "
    >
      <div class="smartoffice-cuti-stat-top">
        <p>
          Terverifikasi
        </p>

        <div class="smartoffice-cuti-stat-icon">
          <!-- VERIFIED DOCUMENT -->
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="
                M14 2H6
                a2 2 0 0 0-2 2v16
                a2 2 0 0 0 2 2h12
                a2 2 0 0 0 2-2V8z
              "
            />

            <polyline
              points="
                14 2 14 8 20 8
              "
            />

            <path
              d="
                m8 15 2.5 2.5L16 12
              "
            />
          </svg>
        </div>
      </div>

      <h3 id="smartofficeArsipProgress">
        <span class="smartoffice-mini-loader"></span>
      </h3>
    </div>
  </div>

  <!-- ======================================================
       TAB NAVIGATION
  ====================================================== -->
  <div class="smartoffice-tab-wrapper">

    <!-- PROGRESS ARSIP -->
    <button
      id="smartofficeTabProgressArsip"
      class="
        smartoffice-tab-button
        active
      "
      type="button"
      onclick="
        smartofficeSwitchArsipTab(
          'progress'
        )
      "
    >
      <!-- CHART / MONITORING -->
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="
            M3 3v18h18
          "
        />

        <path
          d="
            m7 16 4-5 3 3 5-7
          "
        />
      </svg>

      <span>
        Progress Arsip
      </span>
    </button>

    <!-- ARSIP PEGAWAI -->
    <button
      id="smartofficeTabArsipPegawai"
      class="
        smartoffice-tab-button
      "
      type="button"
      onclick="
        smartofficeSwitchArsipTab(
          'arsip'
        )
      "
    >
      <!-- FILE / FOLDER -->
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="
            M4 4
            a2 2 0 0 1 2-2h5l2 3h5
            a2 2 0 0 1 2 2v11
            a2 2 0 0 1-2 2H6
            a2 2 0 0 1-2-2z
          "
        />

        <path
          d="
            M4 8h16
          "
        />
      </svg>

      <span>
        Arsip Pegawai
      </span>
    </button>
  </div>

  <!-- ======================================================
      PROGRESS ARSIP
  ====================================================== -->
  <div
    id="smartofficeProgressArsipContent"
    class="smartoffice-arsippegawai-progress-content"
  >
    <div class="smartoffice-arsippegawai-progress-toolbar">
      <!-- TITLE -->
      <div class="smartoffice-arsippegawai-progress-toolbar-left">
        <div class="smartoffice-arsippegawai-progress-toolbar-icon">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 3v18h18"/>
            <path d="m7 16 4-5 3 3 5-7"/>
          </svg>
        </div>

        <div class="smartoffice-arsippegawai-progress-toolbar-title">
          <h3>
            Monitoring Progress Arsip
          </h3>

          <p>
            Pantau kelengkapan dan status verifikasi arsip pegawai
          </p>
        </div>
      </div>

      <!-- REFRESH -->
      <button
        type="button"
        class="smartoffice-arsippegawai-progress-refresh-btn"
        onclick="
          smartofficeRefreshProgressArsip()
        "
        title="Refresh Progress Arsip"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 2v6h-6"/>
          <path d="M3 12a9 9 0 0 1 15.55-6.36L21 8"/>
          <path d="M3 22v-6h6"/>
          <path d="M21 12a9 9 0 0 1-15.55 6.36L3 16"/>
        </svg>
      </button>
    </div>

    <!-- LIST PROGRESS -->
    <div
      id="smartofficeProgressArsipList"
      class="smartoffice-arsippegawai-progress-list"
    >
    </div>
  </div>

  <!-- ======================================================
       TAB ARSIP PEGAWAI
  ====================================================== -->
  <div
    id="smartofficeArsipPegawaiContent"
    style="display:none;"
  >

    <!-- ==================================================
         FILTER ARSIP
    ================================================== -->
    <div class="smartoffice-arsip-filter-card">

      <!-- NAMA PEGAWAI -->
      <div
        class="
          smartoffice-cuti-form-group
          smartoffice-arsip-filter-pegawai
        "
      >

        <label>
          Nama Pegawai
        </label>

        <select
          id="smartofficeArsipPegawaiSelect"
          class="smartoffice-input"
        >
          <option value="">
            Pilih Pegawai
          </option>
        </select>

      </div>


      <!-- STATUS KEPEGAWAIAN -->
      <div
        class="
          smartoffice-cuti-form-group
          smartoffice-arsip-filter-status
        "
      >

        <label>
          Status Kepegawaian
        </label>

        <select
          id="smartofficeArsipStatusSelect"
          class="smartoffice-input"
        >

          <option value="">
            Semua Status
          </option>

          <option value="BLUD">
            BLUD
          </option>

          <option value="PPPK">
            PPPK
          </option>

          <option value="PPPK PARUH WAKTU">
            PPPK PARUH WAKTU
          </option>

          <option value="PNS">
            PNS
          </option>

        </select>

      </div>


      <!-- ACTION -->
      <div class="smartoffice-arsip-filter-action">

        <button
          type="button"
          class="smartoffice-management-filter-button"
          onclick="
            smartofficeCariArsipPegawai()
          "
        >
          Cari
        </button>

        <button
          type="button"
          class="smartoffice-management-reset-button"
          onclick="
            smartofficeResetArsipPegawai()
          "
        >
          Reset
        </button>

      </div>

    </div>


    <!-- ==================================================
         INFO PEGAWAI
    ================================================== -->
    <div
      id="smartofficeArsipPegawaiInfo"
    >
    </div>


    <!-- ==================================================
         LIST ARSIP
    ================================================== -->
    <div
      id="smartofficeArsipPegawaiList"
    >

      <div class="smartoffice-arsip-empty">

        <div class="smartoffice-arsip-empty-icon">
          🗂️
        </div>

        <h3>
          Belum ada arsip dipilih
        </h3>

        <p>
          Pilih pegawai lalu klik Cari
          untuk melihat arsip pegawai
        </p>

      </div>

    </div>

  </div>

</div>


<!-- ======================================================
     MODAL AKSI ARSIP
====================================================== -->
<div
  id="smartofficeArsipActionModal"
  class="smartoffice-arsip-modal-wrapper"
  style="display:none;"
>

  <div
    class="smartoffice-arsip-modal-content"
  >

    <div
      id="smartofficeArsipActionBody"
    >
    </div>

  </div>

</div>
