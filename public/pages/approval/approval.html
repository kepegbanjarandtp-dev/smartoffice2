<div class="smartoffice-wrapper">

  <!-- =========================
      HEADER
  ========================== -->
  <div class="smartoffice-header">

    <!-- LEFT -->
    <div class="smartoffice-header-info">

      <!-- BACK -->
      <button
        id="smartofficeApprovalBackButton"
        class="smartoffice-back-button"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </button>

      <!-- TITLE -->
      <div class="smartoffice-header-title">
        <div class="smartoffice-header-title-row">
          <div class="smartoffice-header-icon smartoffice-approval-header-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="38"
              height="38"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M9 11l3 3L22 4"
              />
              <path
                d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"
              />
            </svg>
          </div>
          <h2>Approval</h2>
        </div>
        <p>
          Persetujuan pengajuan pegawai
        </p>
      </div>
    </div>

    <!-- REFRESH -->
    <button
      id="smartofficeApprovalRefreshButton"
      class="smartoffice-refresh-button"
      title="Refresh Data"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.75"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M21 12a9 9 0 1 1-3-6.7"/>
        <polyline points="21 3 21 9 15 9"/>
      </svg>
    </button>

  </div>

  <!-- ======================================================
      TAB NAVIGATION
  ====================================================== -->
  <div class="smartoffice-tab-wrapper">

    <!-- TAB CUTI -->
    <button
      id="smartofficeTabApprovalCuti"
      class="smartoffice-tab-button active"
      type="button"
    >
      <span>Approval Cuti</span>

      <span
        id="smartofficeApprovalCutiBadge"
        class="smartoffice-tab-badge"
      >
        0
      </span>
    </button>

    <!-- TAB SPD -->
    <button
      id="smartofficeTabApprovalSpd"
      class="smartoffice-tab-button"
      type="button"
    >
      Approval SPD
    </button>

    <!-- TAB DOKUMEN -->
    <button
      id="smartofficeTabApprovalDokumen"
      class="smartoffice-tab-button"
      type="button"
    >
      Approval Dokumen
    </button>

  </div>

  <!-- ======================================================
      APPROVAL CUTI
  ====================================================== -->
  <div id="smartofficeApprovalCutiContent">

    <div
      id="smartofficeApprovalCutiList"
      class="smartoffice-approval-list"
    >
    </div>

  </div>

  <!-- ======================================================
      APPROVAL SPD
  ====================================================== -->
  <div
    id="smartofficeApprovalSpdContent"
    style="display:none;"
  >

    <div class="smartoffice-empty-state">
      Belum ada approval SPD
    </div>

  </div>

  <!-- ======================================================
      APPROVAL DOKUMEN
  ====================================================== -->
  <div
    id="smartofficeApprovalDokumenContent"
    style="display:none;"
  >

    <div class="smartoffice-empty-state">
      Belum ada approval Dokumen
    </div>

  </div>

<!-- APPROVAL DETAIL MODAL -->
<div
  id="smartofficeApprovalDetailModal"
  class="smartoffice-approval-detail-modal"
>

  <div class="smartoffice-approval-detail-content">

    <!-- HEADER -->
    <div class="smartoffice-approval-detail-header">

      <h3>
        Detail Approval
      </h3>

      <button
        class="smartoffice-approval-detail-close"
        onclick="smartofficeCloseApprovalDetail()"
      >

        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >

          <path d="M18 6L6 18"/>

          <path d="M6 6l12 12"/>

        </svg>

      </button>

    </div>

    <!-- BODY -->
    <div id="smartofficeApprovalDetailBody"></div>

  </div>

</div>
