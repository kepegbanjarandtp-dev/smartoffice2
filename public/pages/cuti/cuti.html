<div class="smartoffice-wrapper">

  <!-- =========================
     HEADER
  ========================== -->
  <div class="smartoffice-header">

    <!-- LEFT -->
    <div class="smartoffice-header-info">

      <!-- BACK -->
      <button
        class="smartoffice-back-button"
        onclick="smartofficeLoadPage('dashboard')"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </button>

      <!-- ICON -->
      <div class="smartoffice-header-icon smartoffice-cuti-header-icon">

        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>

      </div>

      <!-- TITLE -->
      <div class="smartoffice-header-title">

        <h2>e-Cuti</h2>

        <p>
          Pengajuan dan riwayat cuti
        </p>

      </div>

    </div>

    <!-- REFRESH -->
    <button
      id="smartofficeRefreshButton"
      class="smartoffice-refresh-button"
      title="Refresh Data"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.75"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M21 12a9 9 0 1 1-3-6.7"/>
        <polyline points="21 3 21 9 15 9"/>
      </svg>
    </button>

  </div>

  <!-- =========================
        MINI STATS
  ========================= -->
  <div class="smartoffice-cuti-stats-row">

    <!-- SISA CUTI -->
    <div
      class="
        smartoffice-cuti-stat-card
        smartoffice-cuti-stat-blue
      "
    >

      <div class="
        smartoffice-cuti-stat-top
      ">
        <p>
          Sisa Cuti
        </p>
        <div class="
          smartoffice-cuti-stat-icon
        ">
          <svg viewBox="0 0 24 24">

            <rect
              x="3"
              y="4"
              width="18"
              height="18"
              rx="2"
              ry="2"
            />

            <line
              x1="16"
              y1="2"
              x2="16"
              y2="6"
            />

            <line
              x1="8"
              y1="2"
              x2="8"
              y2="6"
            />

            <line
              x1="3"
              y1="10"
              x2="21"
              y2="10"
            />
          </svg>
        </div>      
      </div>

      <h3 id="smartofficeStatSisaCuti">
        <span class="smartoffice-mini-loader"></span>
      </h3>

    </div>

    <!-- MENUNGGU -->
    <div
      class="
        smartoffice-cuti-stat-card
        smartoffice-cuti-stat-orange
      "
    >
    
      <div class="
        smartoffice-cuti-stat-top
      ">
        <p>
          Pending
        </p>
        <div class="
          smartoffice-cuti-stat-icon
        ">
          <svg viewBox="0 0 24 24">

            <path d="
              M6 2h12
              M6 22h12
              M8 2v6
              a4 4 0 0 0 8 0V2
              M16 22v-6
              a4 4 0 0 0-8 0v6
            "/>

          </svg>
        </div>        
      </div>

      <h3 id="smartofficeStatMenungguCuti">
        <span class="smartoffice-mini-loader"></span>
      </h3>

    </div>

    <!-- DISETUJUI -->
    <div
      class="
        smartoffice-cuti-stat-card
        smartoffice-cuti-stat-green
      "
    >

      <div class="
        smartoffice-cuti-stat-top
      ">
        <p>
          Disetujui
        </p>
        <div class="
          smartoffice-cuti-stat-icon
        ">
          <svg viewBox="0 0 24 24">

            <path d="
              M9 11l3 3L22 4
            "/>

            <path d="
              M21 12v7
              a2 2 0 0 1-2 2H5
              a2 2 0 0 1-2-2V5
              a2 2 0 0 1 2-2h11
            "/>

          </svg>
        </div>       
      </div>

      <h3 id="smartofficeStatDisetujuiCuti">
        <span class="smartoffice-mini-loader"></span>
      </h3>

    </div>

  </div>

  <!-- =========================
      TAB NAVIGATION
  ========================= -->
  <div class="smartoffice-tab-wrapper">

    <!-- FORM CUTI -->
    <button
      id="smartofficeTabFormCuti"
      class="
        smartoffice-tab-button
        active
      "
    >

      <svg
        viewBox="0 0 24 24"
      >
        <path d="
          M14 2H6
          a2 2 0 0 0-2 2v16
          a2 2 0 0 0 2 2h12
          a2 2 0 0 0 2-2V8z
        "/>

        <polyline points="
          14 2 14 8 20 8
        "/>

        <line
          x1="12"
          y1="18"
          x2="12"
          y2="12"
        />

        <line
          x1="9"
          y1="15"
          x2="15"
          y2="15"
        />
      </svg>

      <span>
        Form Cuti
      </span>
    </button>

    <!-- RIWAYAT CUTI -->
    <button
      id="smartofficeTabRiwayatCuti"
      class="
        smartoffice-tab-button
      "
    >

      <svg
        viewBox="0 0 24 24"
      >
        <path d="
          M3 3v5h5
        "/>

        <path d="
          M3.05 13
          a9 9 0 1 0 .5-4
          L3 8
        "/>

        <polyline points="
          12 7 12 12 16 14
        "/>
      </svg>

      <span>
        Riwayat Cuti
      </span>
    </button>
  </div>

  <!-- =========================
      FORM CUTI
  ========================== -->
  <div
    id="smartofficeFormCutiContent"
    class="smartoffice-cuti-content"
  >

    <div class="smartoffice-cuti-form-card">

      <!-- =========================
          IDENTITAS
      ========================= -->
      <div class="smartoffice-cuti-subtitle">
        <svg viewBox="0 0 24 24">
          <path d="M12 12c2.761 0 5-2.239 5-5s-2.239-5-5-5-5 2.239-5 5 2.239 5 5 5zm0 2c-3.866 0-7 3.134-7 7h14c0-3.866-3.134-7-7-7z"/>
        </svg>

        <span>
          Identitas Pegawai
        </span>
      </div>

      <div
        class="smartoffice-cuti-info-box"
        id="smartofficeCutiInfoBox"
      >
        <svg viewBox="0 0 24 24">
          <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 15h-2v-6h2zm0-8h-2V7h2z"/>
        </svg>

        <span id="smartofficeCutiInfoText">
          Memuat data pegawai...
        </span>
      </div>

      <!-- Nama -->
      <div class="smartoffice-cuti-form-grid">
        <div class="smartoffice-cuti-form-group">
          <label>
            Nama
          </label>

          <input
            type="text"
            id="smartofficeCutiNama"
            readonly
          >
        </div>

        <!-- NIP -->
        <div class="smartoffice-cuti-form-group">
          <label>
            NIP / NRP
          </label>

          <input
            type="text"
            id="smartofficeCutiNip"
            readonly
          >
        </div>      
      
        <!-- Pangkat -->
        <div class="smartoffice-cuti-form-group">
          <label>
            Pangkat
          </label>

          <input
            type="text"
            id="smartofficeCutiPangkat"
            readonly
          >
        </div>

        <!-- Jabatan -->
        <div class="smartoffice-cuti-form-group">
          <label>
            Jabatan
          </label>

          <input
            type="text"
            id="smartofficeCutiJabatan"
            readonly
          >
        </div>  
      
        <!-- Status -->
        <div class="smartoffice-cuti-form-group">
          <label>
            Status Kepegawaian
          </label>

          <input
            type="text"
            id="smartofficeCutiStatusKepegawaian"
            readonly
          >
        </div>

        <!-- NO WA -->
        <div class="smartoffice-cuti-form-group">
          <label>
            Nomor WhatsApp
          </label>

          <input
            type="text"
            id="smartofficeCutiNoWa"
            readonly
          >
        </div>

        <!-- TMT -->
        <div class="smartoffice-cuti-form-group">
          <label>
            TMT Awal
          </label>

          <input
            type="text"
            id="smartofficeCutiTmtAwal"
            readonly
          >
        </div>

        <!-- MASA KERJA -->
        <div class="smartoffice-cuti-form-group">
          <label>
            Masa Kerja
          </label>

          <input
            type="text"
            id="smartofficeCutiMasaKerja"
            readonly
          >
        </div>
      </div>

      <!-- =========================
          DATA CUTI
      ========================== -->
      <div class="smartoffice-cuti-subtitle">
        <svg viewBox="0 0 24 24">
          <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v13c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 15H5V9h14v10z"/>
        </svg>

        <span>
          Data Cuti
        </span>
      </div>

      <!-- TANGGAL SURAT + JENIS CUTI -->
      <div class="smartoffice-cuti-form-grid">
        <div class="smartoffice-cuti-form-group">
          <label>
            Tanggal Surat Permohonan
          </label>

          <input
            type="date"
            id="smartofficeCutiTanggalSurat"
          >
        </div>

        <div class="smartoffice-cuti-form-group">
          <label>
            Jenis Cuti
          </label>

          <select id="smartofficeCutiJenis"></select>
        </div>
      </div>

      <!-- TANGGAL + JUMLAH -->
      <div class="smartoffice-cuti-form-grid-3">
        <div class="smartoffice-cuti-form-group">
          <label>
            Tanggal Awal
          </label>

          <input
            type="date"
            id="smartofficeCutiTanggalAwal"
          >
        </div>

        <div class="smartoffice-cuti-form-group">
          <label>
            Tanggal Akhir
          </label>

          <input
            type="date"
            id="smartofficeCutiTanggalAkhir"
          >
        </div>

        <div class="smartoffice-cuti-form-group">
          <label>
            Jumlah Cuti
          </label>

          <input
            type="number"
            id="smartofficeCutiJumlah"
            placeholder="0"
            readonly
          >
        </div>

        <!-- SISA CUTI -->
        <div class="smartoffice-cuti-form-group">
          <label>
            Sisa Cuti Tahunan
          </label>

          <input
            type="text"
            id="smartofficeCutiSisaCuti"
            readonly
          >
        </div>
      </div>

      <!-- KEPERLUAN -->
      <div class="smartoffice-cuti-form-group">
        <label>
          Keperluan
        </label>

        <textarea
          rows="3"
          id="smartofficeCutiKeperluan"
          placeholder="
            Tulis keperluan cuti
          "
        ></textarea>
      </div>

      <!-- ALAMAT SAAT CUTI -->
      <div class="smartoffice-cuti-form-group full-width">

        <label>
          Alamat Selama Menjalani Cuti
        </label>

        <textarea
          rows="3"
          id="smartofficeCutiAlamatSaatCuti"
          placeholder="Masukkan alamat selama menjalani cuti"
        ></textarea>

      </div>

      <div class="smartoffice-cuti-form-grid">
        <div class="smartoffice-cuti-form-group">
          <label
            for="smartofficeCutiLampiran"
            class="smartoffice-cuti-upload-box"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>

              <polyline points="17 8 12 3 7 8"/>

              <line
                x1="12"
                x2="12"
                y1="3"
                y2="15"
              />
            </svg>

            <div>
              <strong>
                Upload Lampiran
              </strong>

              <p>
                PDF, JPG, PNG (Opsional)
              </p>

              <span id="smartofficeCutiFileName">
                Belum ada file dipilih
              </span>
            </div>
          </label>

          <input
            type="file"
            id="smartofficeCutiLampiran"
            accept=".pdf,.jpg,.jpeg,.png"
            hidden
          >
        </div>

        <div></div>

      </div>  

      <!-- =========================
          PENDELEGASIAN
      ========================== -->
      <div class="smartoffice-cuti-subtitle">
        <svg viewBox="0 0 24 24">
          <path d="M16 11c1.657 0 3-1.343 3-3S17.657 5 16 5s-3 1.343-3 3 1.343 3 3 3zm-8 0c1.657 0 3-1.343 3-3S9.657 5 8 5 5 6.343 5 8s1.343 3 3 3zm0 2c-2.667 0-8 1.333-8 4v2h10v-2c0-1.067.333-2 1-2.8C10.067 13.4 8.933 13 8 13zm8 0c-.933 0-2.067.4-3 1.2.667.8 1 1.733 1 2.8v2h10v-2c0-2.667-5.333-4-8-4z"/>
        </svg>

        <span>
          Pendelegasian
        </span>
      </div>

      <div class="smartoffice-cuti-form-grid">
        <div class="smartoffice-cuti-form-group">

          <label>
            Penerima Delegasi
          </label>

          <div class="smartoffice-cuti-autocomplete">

            <input
              type="text"
              id="smartofficeCutiDelegasi"
              placeholder="
                Nama penerima delegasi
              "
            >

            <div
              id="smartofficeCutiDelegasiAutocomplete"
              class="smartoffice-cuti-autocomplete-list"
            ></div>

          </div>

        </div>

        <div class="smartoffice-cuti-form-group">
          <label>
            NIP / NRP Delegasi
          </label>

          <input
            type="text"
            id="smartofficeCutiDelegasiNip"
            readonly
          >
        </div>
      </div>

      <div class="
        smartoffice-cuti-form-group
        smartoffice-delegasi-tugas-group
      ">

        <label>
          Tugas Yang Didelegasikan
        </label>

        <textarea
          rows="3"
          id="smartofficeCutiTugasDelegasi"
          placeholder="
            Tulis tugas yang didelegasikan
          "
        ></textarea>
      </div>

      <!-- =========================
          SUBMIT
      ========================== -->
      <button
        class="smartoffice-cuti-submit-button"
        id="smartofficeCutiSubmitButton"
      >
        Ajukan Cuti
      </button>

    </div>
    <!-- END FORM CARD -->

  </div>
  <!-- END FORM CONTENT -->

  <!-- =========================
      RIWAYAT CUTI
  ========================= -->
  <div
    id="smartofficeRiwayatCutiContent"
    class="
      smartoffice-cuti-content
    "
    style="display:none;"
  >

    <!-- =========================
        FILTER
    ========================= -->
    <div class="smartoffice-riwayat-filter">

      <!-- SEMUA -->
      <button
        class="
          smartoffice-riwayat-filter-item
          active
        "
        onclick="
          smartofficeFilterRiwayatCuti(
            'SEMUA',
            this
          )
        "
      >
        <svg
          viewBox="0 0 24 24"
        >
          <path d="
            M4 4h6v6H4z
            M14 4h6v6h-6z
            M4 14h6v6H4z
            M14 14h6v6h-6z
          "/>
        </svg>

        <span>
          Semua
        </span>
      </button>

      <!-- MENUNGGU -->
      <button
        class="
          smartoffice-riwayat-filter-item
        "
        onclick="
          smartofficeFilterRiwayatCuti(
            'MENUNGGU',
            this
          )
        "
      >
        <svg
          viewBox="0 0 24 24"
        >
          <path d="
            M6 2v6h12V2
            M6 22v-6h12v6
            M6 8l12 8
          "/>
        </svg>

        <span>
          Menunggu
        </span>
      </button>

      <!-- DISETUJUI -->
      <button
        class="
          smartoffice-riwayat-filter-item
        "
        onclick="
          smartofficeFilterRiwayatCuti(
            'DISETUJUI',
            this
          )
        "
      >
        <svg
          viewBox="0 0 24 24"
        >
          <path d="
            M20 6L9 17l-5-5
          "/>
        </svg>

        <span>
          Disetujui
        </span>
      </button>

      <!-- DITOLAK -->
      <button
        class="
          smartoffice-riwayat-filter-item
        "
        onclick="
          smartofficeFilterRiwayatCuti(
            'DITOLAK',
            this
          )
        "
      >
        <svg
          viewBox="0 0 24 24"
        >
          <path d="
            M18 6L6 18
            M6 6l12 12
          "/>
        </svg>

        <span>
          Ditolak
        </span>
      </button>

    </div>

    <!-- LIST -->
    <div
      id="smartofficeRiwayatCutiList"
    ></div>
    
  </div>
</div>

<!-- ======================================================
     RIWAYAT DETAIL MODAL
====================================================== -->
<div
  id="smartofficeRiwayatCutiDetailModal"
  class="smartoffice-cuti-riwayat-modal"
>

  <div class="
    smartoffice-cuti-riwayat-modal-content
  ">

    <!-- HEADER -->
    <div class="
      smartoffice-cuti-riwayat-modal-header
    ">
      <h3 class="
        smartoffice-cuti-riwayat-modal-title
      ">
        Detail Pengajuan Cuti
      </h3>

      <button
        class="
          smartoffice-cuti-riwayat-modal-close
        "
        onclick="
          smartofficeCloseRiwayatCutiDetail()
        "
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M18 6L6 18"/>
          <path d="M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- BODY -->
    <div
      id="smartofficeRiwayatCutiDetailBody"
      class="
        smartoffice-cuti-riwayat-modal-body
      "
    ></div>
  </div>
</div>
