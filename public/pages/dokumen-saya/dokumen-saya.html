<div class="smartoffice-wrapper">

    <!-- =========================
        HEADER
    ========================== -->
    <div class="smartoffice-header">

        <!-- LEFT -->
        <div class="smartoffice-header-info">

            <!-- BACK -->
            <button
                class="smartoffice-back-button"
                onclick="smartofficeLoadPage('dashboard')"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="m15 18-6-6 6-6"/>
                </svg>
            </button>

            <!-- ICON -->
            <div
                class="
                    smartoffice-header-icon
                    smartoffice-dokumen-saya-header-icon
                "
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path
                        d="
                            M6 3
                            h9
                            l3 3
                            v15
                            H6
                            z
                        "
                    />
                    <path
                        d="
                            M15 3
                            v4
                            h4
                        "
                    />
                    <line
                        x1="9"
                        y1="11"
                        x2="16"
                        y2="11"
                    />
                    <line
                        x1="9"
                        y1="15"
                        x2="16"
                        y2="15"
                    />
                    <line
                        x1="9"
                        y1="19"
                        x2="13"
                        y2="19"
                    />
                </svg>
            </div>

            <!-- TITLE -->
            <div class="smartoffice-header-title">
                <h2>
                    Dokumen Saya
                </h2>
                <p>
                    Kelola dokumen kepegawaian
                </p>
            </div>
        </div>

        <!-- REFRESH -->
        <button
            id="smartofficeDokumenSayaRefreshButton"
            class="smartoffice-refresh-button"
            onclick="smartofficeRefreshDokumen()"
            title="Refresh Data"
        >
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.75"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M21 12a9 9 0 1 1-3-6.7"/>
                <polyline
                    points="21 3 21 9 15 9"
                />
            </svg>
        </button>
    </div>

    <!-- =========================
        MINI STATS
    ========================= -->
    <div class="smartoffice-cuti-stats-row">

        <!-- DOKUMEN WAJIB -->
        <div
            class="
                smartoffice-cuti-stat-card
                smartoffice-cuti-stat-blue
            "
        >
            <div class="
                smartoffice-cuti-stat-top
            ">
                <p>
                    Arsip Wajib
                </p>

                <div class="
                    smartoffice-cuti-stat-icon
                ">
                    <svg viewBox="0 0 24 24">
                        <path d="
                            M6 3
                            h9
                            l3 3
                            v15
                            H6
                            z
                        "/>
                        <path d="
                            M15 3
                            v4
                            h4
                        "/>
                        <line
                            x1="9"
                            y1="11"
                            x2="16"
                            y2="11"
                        />
                        <line
                            x1="9"
                            y1="15"
                            x2="16"
                            y2="15"
                        />
                        <line
                            x1="9"
                            y1="19"
                            x2="13"
                            y2="19"
                        />
                    </svg>
                </div>
            </div>

            <h3 id="smartofficeDokumenTotal">
                <span class="
                    smartoffice-mini-loader
                "></span>
            </h3>
        </div>

        <!-- TERVERIFIKASI -->
        <div
            class="
                smartoffice-cuti-stat-card
                smartoffice-cuti-stat-orange
            "
        >
            <div class="
                smartoffice-cuti-stat-top
            ">
                <p>
                    Terverifikasi
                </p>

                <div class="
                    smartoffice-cuti-stat-icon
                ">
                    <svg viewBox="0 0 24 24">
                        <path d="
                            M9 11
                            l3 3
                            L22 4
                        "/>
                        <path d="
                            M21 12
                            v7
                            a2 2 0 0 1-2 2
                            H5
                            a2 2 0 0 1-2-2
                            V5
                            a2 2 0 0 1 2-2
                            h11
                        "/>
                    </svg>
                </div>
            </div>

            <h3 id="smartofficeDokumenTerverifikasi">
                <span class="
                    smartoffice-mini-loader
                "></span>
            </h3>
        </div>

        <!-- PROGRESS -->
        <div
            class="
                smartoffice-cuti-stat-card
                smartoffice-cuti-stat-green
            "
        >
            <div class="
                smartoffice-cuti-stat-top
            ">
                <p>
                    Progress
                </p>

                <div class="
                    smartoffice-cuti-stat-icon
                ">
                    <svg viewBox="0 0 24 24">
                        <circle
                            cx="12"
                            cy="12"
                            r="9"
                        />
                        <path d="
                            M12 7
                            v5
                            l3 2
                        "/>
                    </svg>
                </div>
            </div>

            <h3 id="smartofficeDokumenProgress">
                <span class="
                    smartoffice-mini-loader
                "></span>
            </h3>
        </div>
    </div>

    <!-- =========================
        TAB NAVIGATION
    ========================= -->
    <div class="smartoffice-tab-wrapper">

        <!-- UPLOAD DOKUMEN -->
        <button
            id="smartofficeTabUploadDokumen"
            class="
                smartoffice-tab-button
                active
            "
            onclick="
                smartofficeSwitchDokumenTab(
                    'upload'
                )
            "
        >
            <svg
                viewBox="0 0 24 24"
            >
                <path d="
                    M14 2H6
                    a2 2 0 0 0-2 2v16
                    a2 2 0 0 0 2 2h12
                    a2 2 0 0 0 2-2V8z
                "/>
                <polyline points="
                    14 2 14 8 20 8
                "/>
                <line
                    x1="12"
                    y1="18"
                    x2="12"
                    y2="12"
                />
                <line
                    x1="9"
                    y1="15"
                    x2="15"
                    y2="15"
                />
            </svg>

            <span>
                Upload Dokumen
            </span>
        </button>

        <!-- DOKUMEN SAYA -->
        <button
            id="smartofficeTabDokumenSaya"
            class="
                smartoffice-tab-button
            "
            onclick="
                smartofficeSwitchDokumenTab(
                    'riwayat'
                )
            "
        >
            <svg
                viewBox="0 0 24 24"
            >
                <path d="
                    M4 4
                    a2 2 0 0 1 2-2
                    h5
                    l2 2
                    h5
                    a2 2 0 0 1 2 2
                    v14
                    a2 2 0 0 1-2 2H6
                    a2 2 0 0 1-2-2z
                "/>
                <path d="
                    M8 11
                    h8
                "/>
                <path d="
                    M8 15
                    h6
                "/>
            </svg>

            <span>
                Dokumen Saya
            </span>
        </button>
    </div>

    <!-- =========================
        FORM UPLOAD
    ========================== -->
    <div
        id="smartofficeUploadDokumenContent"
        class="smartoffice-dokumen-saya-content"
    >
        <!-- FORM CARD -->
        <div
            class="smartoffice-dokumen-saya-form-card"
        >
            <!-- =========================
                IDENTITAS PEGAWAI
            ========================== -->
            <div
                class="smartoffice-dokumen-saya-subtitle"
            >
                <span>
                    Identitas Pegawai
                </span>
            </div>

            <div
                class="smartoffice-dokumen-saya-form-grid"
            >
                <!-- NAMA -->
                <div
                    class="
                        smartoffice-dokumen-saya-form-group
                    "
                >
                    <label>
                        Nama
                    </label>

                    <input
                        type="text"
                        id="smartofficeDokumenNama"
                        readonly
                    >
                </div>

                <!-- NIP / NRP -->
                <div
                    class="
                        smartoffice-dokumen-saya-form-group
                    "
                >
                    <label>
                        NIP / NRP
                    </label>
                    <input
                        type="text"
                        id="smartofficeDokumenNip"
                        readonly
                    >
                </div>

                <!-- JABATAN -->
                <div
                    class="
                        smartoffice-dokumen-saya-form-group
                    "
                >
                    <label>
                        Jabatan
                    </label>

                    <input
                        type="text"
                        id="smartofficeDokumenJabatan"
                        readonly
                    >
                </div>

                <!-- STATUS KEPEGAWAIAN -->
                <div
                    class="
                        smartoffice-dokumen-saya-form-group
                    "
                >
                    <label>
                        Status Kepegawaian
                    </label>

                    <input
                        type="text"
                        id="smartofficeDokumenStatus"
                        readonly
                    >
                </div>

                <!-- JENIS PEGAWAI -->
                <div
                    class="
                        smartoffice-dokumen-saya-form-group
                    "
                >
                    <label>
                        Jenis Pegawai
                    </label>

                    <input
                        type="text"
                        id="smartofficeDokumenJenis"
                        readonly
                    >
                </div>
            </div>

            <!-- =========================
                DATA DOKUMEN
            ========================== -->
            <div
                class="smartoffice-dokumen-saya-subtitle"
            >
                <span>
                    Data Dokumen
                </span>
            </div>

            <div
                class="smartoffice-dokumen-saya-form-grid"
            >
                <!-- JENIS DOKUMEN -->
                <div
                    class="
                        smartoffice-dokumen-saya-form-group
                    "
                >
                    <label>
                        Jenis Dokumen
                    </label>

                    <select
                        id="smartofficeDokumenJenisDokumen"
                    >
                        <option value="">
                            Pilih Dokumen
                        </option>
                    </select>
                </div>

                <!-- NOMOR DOKUMEN -->
                <div
                    class="
                        smartoffice-dokumen-saya-form-group
                    "
                >
                    <label>
                        Nomor Dokumen
                    </label>

                    <input
                        type="text"
                        id="smartofficeDokumenNomor"
                        placeholder="Nomor dokumen"
                    >
                </div>

                <!-- KETERANGAN -->
                <div
                    class="
                        smartoffice-dokumen-saya-form-group
                    "
                >
                    <label>
                        Keterangan
                    </label>

                    <input
                        type="text"
                        id="smartofficeDokumenKeterangan"
                        placeholder="Opsional"
                    >
                </div>
            </div>

            <!-- =========================
                FILE DOKUMEN
            ========================== -->
            <div
                class="
                    smartoffice-dokumen-saya-form-group
                "
            >
                <input
                    type="file"
                    id="smartofficeDokumenFile"
                    accept=".pdf,.jpg,.jpeg,.png"
                    hidden
                >
                <div
                    class="
                        smartoffice-dokumen-saya-upload-box
                    "
                    onclick="
                        document.getElementById(
                            'smartofficeDokumenFile'
                        ).click()
                    "
                >
                    <strong>
                        Pilih Berkas
                    </strong>

                    <p>
                        PDF/JPG/PNG • Max 5 MB
                    </p>

                    <span
                        id="smartofficeDokumenSayaFileName"
                    >
                        Belum ada file dipilih
                    </span>
                </div>
            </div>

            <!-- =========================
                SUBMIT
            ========================== -->
            <button
                class="
                    smartoffice-dokumen-saya-submit-button
                "
                id="smartofficeDokumenSubmitButton"
                onclick="
                    smartofficeSubmitDokumen()
                "
            >
                <span
                    class="
                        smartoffice-btn-spinner
                    "
                    style="display:none;"
                ></span>

                <span
                    class="
                        smartoffice-btn-text
                    "
                >
                    Simpan Dokumen
                </span>
            </button>
        </div>
    </div>

    <!-- =========================
        RIWAYAT DOKUMEN
    ========================== -->
    <div
        id="smartofficeDokumenSayaContent"
        class="smartoffice-dokumen-saya-content"
        style="display:none;"
    >
        <div
            id="smartofficeDokumenSayaList"
        ></div>
    </div>
</div>

<!-- =========================
     MODAL UBAH DOKUMEN
========================= -->
<div
    id="smartofficeEditDokumenModal"
    class="smartoffice-dokumen-saya-modal-overlay"
    style="display:none;"
>
    <div
        class="smartoffice-dokumen-saya-modal-content"
        id="smartofficeEditDokumenBody"
    >
    </div>
</div>
