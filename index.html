<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <link
    rel="icon"
    type="image/svg+xml"
    href="/favicon.svg"
  />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <!-- GOOGLE FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
  >

  <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
  >

  <title>SmartOffice V2</title>
</head>

<body>

  <!-- ======================================================
       APP
  ======================================================= -->
  <div id="app"></div>


  <!-- ======================================================
       GLOBAL PREVIEW
  ======================================================= -->
  <div
    id="smartofficePreviewModal"
    class="smartoffice-preview-overlay"
    style="display:none;"
  >

    <div
      class="smartoffice-preview-card"
    >

      <div
        class="smartoffice-preview-header"
      >

        <h3>
          📄 Preview Dokumen
        </h3>

        <div
          class="smartoffice-preview-actions"
        >

          <a
            id="smartofficePreviewDownloadBtn"
            class="smartoffice-preview-download-btn"
            target="_blank"
            download
          >
            Download
          </a>

          <button
            onclick="smartofficeClosePreviewDokumen()"
          >
            ✕
          </button>

        </div>

      </div>


      <div
        id="smartofficePreviewFileName"
        class="smartoffice-preview-file-name"
      ></div>


      <div
        id="smartofficePreviewContent"
        class="smartoffice-preview-content"
      ></div>


      <div
        id="smartofficePreviewToolbar"
        class="smartoffice-preview-toolbar"
        style="display:none;"
      >

        <button
          onclick="smartofficeZoomOut()"
        >
          ➖
        </button>

        <span
          id="smartofficePreviewZoomText"
        >
          100%
        </span>

        <button
          onclick="smartofficeZoomIn()"
        >
          ➕
        </button>

      </div>

    </div>

  </div>


  <!-- ======================================================
       MAIN JS
  ======================================================= -->
  <script
    type="module"
    src="/src/main.js"
  ></script>

</body>

</html>
